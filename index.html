<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TacticsLab Pro - Landscape Studio</title>
  <link rel="stylesheet" href="./styles/offline.css">

  <style>
    /* App-specific local polish that does not require network resources. */
    .pitch-grass-landscape { background-color: #07170e; }
    .pitch-glow-boundary { box-shadow: 0 0 35px rgba(16, 185, 129, 0.18), inset 0 0 40px rgba(0, 0, 0, 0.9); }
    .player-token-body { position: relative; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
    .tool-btn { border-width: 1px; }
    .tool-btn.active { background-color: #059669; color: white; }
    .player-token-body > span { position: relative; z-index: 1; }
    .player-token-body .absolute { position: absolute; }
  </style>
</head>

<body class="bg-[#04060d] text-slate-100 font-sans h-screen w-screen overflow-hidden flex flex-col select-none antialiased">
  <!-- same HTML body content as before -->
  <header class="h-12 sm:h-14 border-b border-slate-800/90 bg-[#080d1b] px-3 sm:px-5 flex items-center justify-between shrink-0 z-30 shadow-lg">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-500 to-cyan-400 flex items-center justify-center shadow-md shadow-emerald-500/20">
        <svg class="w-5 h-5 text-slate-950 font-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </div>
      <div>
        <h1 class="font-display font-bold text-xs sm:text-base tracking-wide flex items-center gap-1.5">
          TACTICS<span class="text-emerald-400">LAB</span> <span class="text-cyan-400 font-mono text-xs">WIDE</span>
        </h1>
      </div>
      <div class="hidden lg:flex items-center gap-2 ml-3 border-l border-slate-800 pl-3 text-[11px] font-mono">
        <span class="text-amber-300 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/30">Easy (GK #1)</span>
        <span class="text-cyan-300 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/30">Nick (DEF #4)</span>
        <span class="text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30">Daniel &amp; Angel (Extras)</span>
      </div>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <div class="hidden md:flex items-center bg-slate-900 border border-slate-800 rounded-lg p-0.5 text-[11px] font-mono">
        <button id="btn-fx-glow" onclick="setLedEffect('glow')" class="px-2 py-0.5 rounded text-emerald-400 bg-emerald-500/20 font-bold">Glow</button>
        <button id="btn-fx-blink" onclick="setLedEffect('blink')" class="px-2 py-0.5 rounded text-slate-400 hover:text-white">Blink</button>
        <button id="btn-fx-steady" onclick="setLedEffect('steady')" class="px-2 py-0.5 rounded text-slate-400 hover:text-white">Steady</button>
        <button id="btn-fx-off" onclick="setLedEffect('off')" class="px-2 py-0.5 rounded text-slate-400 hover:text-white">Off</button>
      </div>

      <button id="btn-multi-toggle" onclick="toggleMultiSelection()" title="Toggle showing multiple player lines at the same time" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-900 text-xs font-semibold text-slate-300 hover:border-cyan-400 transition">
        <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="hidden sm:inline">Link Lines:</span>
        <span id="multi-select-label" class="font-mono text-slate-400 text-[11px]">OFF</span>
      </button>

      <button onclick="openPlansHistoryModal()" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-cyan-500/15 border border-cyan-500/40 text-cyan-300 hover:bg-cyan-500/25 text-xs font-bold transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span>Plans Hub</span>
        <span id="hub-count-badge" class="px-1.5 py-0.2 bg-cyan-400/20 text-cyan-200 text-[10px] rounded-full font-mono">4</span>
      </button>

      <button onclick="openSavePlanModal()" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs transition shadow-md shadow-emerald-500/20">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
        <span class="hidden sm:inline">Save</span>
      </button>

      <button onclick="shareCurrentPlanURL()" title="Share Link with other coaches" class="p-1.5 sm:px-2.5 sm:py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
      </button>

      <button onclick="startCoachTutorial(true)" title="Coach Tutorial" class="p-1.5 sm:px-2 sm:py-1 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-300 hover:bg-amber-500/20 text-xs font-semibold transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16v-4m0-4h.01M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20z"/>
        </svg>
      </button>

      <button onclick="toggleSidebar()" class="p-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:text-white transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden relative">
    <aside class="w-12 sm:w-14 bg-[#060a14] border-r border-slate-800/90 flex flex-col items-center py-2.5 gap-2 shrink-0 z-20">
      <button onclick="resetBallPosition()" title="Reset Ball to Kick-Off Spot" class="w-9 h-9 rounded-lg bg-slate-900 border border-slate-700 hover:border-emerald-400 flex items-center justify-center transition shadow-md group relative">
        <div class="w-4 h-4 rounded-full bg-white flex items-center justify-center">
          <div class="w-1.5 h-1.5 rounded-full bg-slate-900"></div>
        </div>
      </button>
      <div class="w-6 h-[1px] bg-slate-800 my-0.5"></div>
      <button id="tool-select" onclick="setActiveTool('select')" title="Select & Move Player" class="tool-btn w-9 h-9 rounded-lg bg-emerald-600 text-white flex items-center justify-center transition shadow-md shadow-emerald-500/25">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
      </button>
      <button id="tool-arrow" onclick="setActiveTool('arrow')" title="Draw Sprint Line (Solid Arrow)" class="tool-btn w-9 h-9 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
      <button id="tool-pass" onclick="setActiveTool('pass')" title="Draw Passing Lane (Dashed Line)" class="tool-btn w-9 h-9 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="7" y2="12" stroke-dasharray="2 2" stroke-linecap="round"/>
          <line x1="10" y1="12" x2="16" y2="12" stroke-dasharray="2 2" stroke-linecap="round"/>
          <polyline points="15 6 21 12 15 18" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="tool-dribble" onclick="setActiveTool('dribble')" title="Draw Dribbling Route (Wavy Line)" class="tool-btn w-9 h-9 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12c2.5-4 4.5-4 7 0s4.5 4 7 0 4.5-4 7 0"/></svg>
      </button>
      <button id="tool-pen" onclick="setActiveTool('pen')" title="Freehand Pen" class="tool-btn w-9 h-9 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
      </button>
      <div class="mt-auto flex flex-col items-center gap-2 pb-1">
        <button onclick="undoActiveRoute()" title="Undo Player Line" class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a5 5 0 015 5v2M3 10l6-6M3 10l6 6"/></svg>
        </button>
        <button onclick="clearSelectedRoutes()" title="Clear Active Player Line" class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 text-rose-400 hover:bg-rose-500/20 flex items-center justify-center transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      </div>
    </aside>

    <main class="flex-1 bg-[#020409] p-2 sm:p-3.5 flex flex-col items-center justify-center overflow-hidden relative">
      <div id="landscape-pitch-wrapper" class="relative rounded-2xl overflow-hidden border border-emerald-500/40 pitch-glow-boundary led-glow select-none touch-none w-full h-full max-w-[98vw] max-h-[92vh] aspect-[105/68] flex items-center justify-center">
        <div class="absolute inset-0 pitch-grass-landscape">
          <svg class="w-full h-full pointer-events-none" viewBox="0 0 1050 680" preserveAspectRatio="none">
            <rect x="25" y="25" width="1000" height="630" fill="none" stroke="#ffffff" stroke-width="3" rx="4" stroke-opacity="0.9"/>
            <line x1="525" y1="25" x2="525" y2="655" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9"/>
            <circle cx="525" cy="340" r="91.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9"/>
            <circle cx="525" cy="340" r="4.5" fill="#ffffff"/>
          </svg>
        </div>
        <canvas id="tactic-canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-auto cursor-crosshair"></canvas>
        <div id="tokens-layer" class="absolute inset-0 pointer-events-none z-20"></div>
        <div class="absolute bottom-2 left-3 pointer-events-none px-2.5 py-1 rounded-md bg-slate-950/80 backdrop-blur border border-slate-800 text-[10px] font-mono text-slate-400 z-30 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="field-formation-indicator">2-2 Arena Landscape</span>
        </div>
      </div>
    </main>

    <aside id="side-panel" class="w-72 sm:w-80 bg-[#080d19] border-l border-slate-800 flex flex-col shrink-0 z-20 overflow-y-auto"></aside>
  </div>

  <script>
    // This file now runs entirely offline; no external CDNs or Google Fonts are loaded.
    console.log('Offline-safe TacticsLab loaded');
  </script>
</body>
</html>
